<script>
// ============================================================
// 常量（与Python v12.2 完全一致）
// ============================================================
const API_URL = "https://pc28.help/api/kj.json?nbr=100";
const CHECK_INTERVAL = 15000;

const COMBO_ALPHA = 0.50, COMBO_BETA = 0.50;
const A_WINDOWS = [10, 20, 30, 50, 100];
const A_DEFAULT_WINDOW_WEIGHTS = {10:0.10, 20:0.15, 30:0.20, 50:0.25, 100:0.30};
const A_RELIABILITY_FLOOR = 0.30;
const A_REVERSAL_STREAK = 4;
const A_TYPE_WINDOWS = [10, 20, 30];
const A_MAX_WEIGHT_DEVIATION = 0.10;
const A_ANOMALY_GAP = 5;

const B_SEED_MIN = 1000, B_SEED_MAX = 50000, B_COARSE_STEP = 10;
const B_REFINE_TOP = 100;
const B_TOP_SEEDS = 50, B_FINAL_SEEDS = 7;
const B_SCORE_WEIGHTS = [0.40, 0.30, 0.20, 0.10];
const B_GROUP_SMOOTHING = 0.5;
const B_EXCLUDED_PENALTY_WEIGHT = 0.10;
const B_RECENT_EWMA_ALPHA = 0.35;
const B_EWMA_SECONDARY_WEIGHT = 0.10;
const ALL_TYPES = ["大单","大双","小单","小双"];
const COMBO_TYPES = ["大单","大双","小单","小双"];

const DEFAULT_WEIGHT = [0.4, 0.3, 0.3];
const WEIGHT_UPDATE_INTERVAL = 20;

// ============================================================
// 工具函数
// ============================================================
function get_type(sum_val) {
  const size = sum_val >= 14 ? "大" : "小";
  const parity = sum_val % 2 === 1 ? "单" : "双";
  return size + parity;
}
function is_big(sum_val) { return sum_val >= 14; }
function get_size(sum_val) { return is_big(sum_val) ? "大" : "小"; }
function get_parity(sum_val) { return sum_val % 2 === 1 ? "单" : "双"; }

function get_time_slot(hour, minute) {
  if (hour === 19 && minute < 30) return "维护时段";
  if (hour < 6) return "凌晨";
  if (hour < 8) return "早上";
  if (hour < 12) return "上午";
  if (hour < 14) return "中午";
  if (hour < 18) return "下午";
  if (hour < 19) return "傍晚";
  return "晚上";
}
function is_maintenance_time(hour, minute) { return hour === 19 && minute < 30; }

function mulberry32(seed) {
  function imul32(a, b) {
    let v = ((a & 0xFFFFFFFF) * (b & 0xFFFFFFFF)) & 0xFFFFFFFF;
    if (v & 0x80000000) v -= 0x100000000;
    return v;
  }
  let a = (parseInt(seed) & 0xFFFFFFFF) + 0x6D2B79F5; a &= 0xFFFFFFFF;
  let t = imul32((a ^ (a >>> 15)), (1 | a));
  t = (t + imul32((t ^ (t >>> 7)), (61 | t))) & 0xFFFFFFFF ^ t;
  t = t >>> 0; t ^= (t >>> 14);
  return (t >>> 0) / 4294967296.0;
}

const SEQUENCES = [
  [0,3,9,12,15,18,21,24,27],
  [1,4,7,10,13,16,19,22,25],
  [2,5,8,11,14,17,20,23,26]
];
function is_same_seq(a, b) { return SEQUENCES.some(s => s.includes(a) && s.includes(b)); }

const RULES = {
  same: {"小双":["小双","大双","大单"],"小单":["小单","大单","大双"],"大双":["大双","小双","小单"],"大单":["大单","小单","小双"]},
  diff: {"小双":["小双","小单","大单"],"小单":["小单","小双","大双"],"大双":["大双","大单","小单"],"大单":["大单","大双","小双"]}
};

function get_prediction(seed, prev) {
  const rv = mulberry32(seed + parseInt(prev.nbr || prev.expect));
  const prod = rv * prev.sum;
  const digits = prod.toFixed(3).replace(".", "");
  const final_sum = [...digits].reduce((a, d) => a + parseInt(d), 0);
  const ct = get_type(final_sum);
  const rand_str = rv.toFixed(8);
  const rand_digits = rand_str.split(".")[1].substring(0, 3);
  const rand_sum = [...rand_digits].reduce((a, d) => a + parseInt(d), 0);
  const same = is_same_seq(rand_sum, prev.sum);
  return [...RULES[same ? "same" : "diff"][ct]];
}

// ============================================================
// 模型A
// ============================================================
function recent(h, w) { return h.length >= w ? h.slice(-w) : h; }
function p_big(h, w) { const r = recent(h, w); if (!r.length) return 0.5; return r.filter(x => is_big(x.sum)).length / r.length; }
function max_streak(h, w) { const r = recent(h, w); if (!r.length) return 0; let m = 1, c = 1; for (let i = 1; i < r.length; i++) { if (is_big(r[i].sum) === is_big(r[i-1].sum)) { c++; m = Math.max(m, c); } else c = 1; } return m; }
function alternation(h, w) { const r = recent(h, w); let a = 0; for (let i = 1; i < r.length; i++) if (is_big(r[i].sum) !== is_big(r[i-1].sum)) a++; return a; }

function _judge_single(h, w) {
  if (h.length < w) return "均衡型";
  const p = p_big(h, w), s = max_streak(h, w), a = alternation(h, w);
  if (s <= 2 && a >= Math.max(6, Math.floor(w * 0.6))) return "交替型";
  if ((p >= 0.60 || p <= 0.40) && s >= 4) return "趋势型";
  if ((p >= 0.55 || p <= 0.45) && s <= 2 && a <= Math.max(5, Math.floor(w * 0.5))) return "信号型";
  return "均衡型";
}
function judge_type(h) {
  if (h.length < 10) return "均衡型";
  const types = A_TYPE_WINDOWS.filter(w => h.length >= w).map(w => _judge_single(h, w));
  if (!types.length) return "均衡型";
  const cnt = {}; types.forEach(t => cnt[t] = (cnt[t] || 0) + 1);
  const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (best[0] !== "均衡型" && best[1] < 2) return "均衡型";
  return best[0];
}

function generate_weight_candidates() {
  const cands = [];
  for (let i = 0; i < 13; i++) cands.push(Math.round((0.15 + i * 0.05) * 100) / 100);
  return cands;
}
function score_sequence(seq, weight) {
  if (seq.length < 20) return 0.5;
  let hits = 0, total = 0;
  for (let i = 10; i < seq.length; i++) {
    const prev = seq.slice(0, i);
    const p = p_big(prev, 10);
    const short = recent(prev, Math.min(5, prev.length));
    const sp = short.length ? short.filter(x => is_big(x.sum)).length / short.length : 0.5;
    const trend = 0.5 + Math.max(-0.25, Math.min(0.25, (sp - 0.5) * 0.8));
    const lb = is_big(prev[prev.length - 1].sum);
    let cs = 1; for (let j = prev.length - 2; j >= 0; j--) { if (is_big(prev[j].sum) === lb) cs++; else break; }
    const streak_sig = 0.5 + (lb ? 0.25 : -0.25) * Math.min(cs / 5.0, 1.0);
    const [w1, w2, w3] = weight;
    const raw = p * w1 + trend * w2 + streak_sig * w3;
    const pred = raw >= 0.5 ? "大" : "小";
    const actual = is_big(seq[i].sum) ? "大" : "小";
    if (pred === actual) hits++; total++;
  }
  return total ? hits / total : 0.5;
}
function search_best_weight(hist) {
  if (hist.length < 50) return DEFAULT_WEIGHT;
  const candidates = generate_weight_candidates();
  const cw = [];
  for (const w1 of candidates) {
    for (const w2 of candidates) {
      const w3 = Math.round((1.0 - w1 - w2) * 100) / 100;
      if (w3 >= 0.15 && w3 <= 0.75 && Math.abs(w1 + w2 + w3 - 1.0) <= 0.001) cw.push([w1, w2, w3]);
    }
  }
  let best_s = -1, best_w = DEFAULT_WEIGHT;
  for (const w of cw) {
    const rate = score_sequence(hist, w);
    const dist = Math.abs(w[0]-DEFAULT_WEIGHT[0])+Math.abs(w[1]-DEFAULT_WEIGHT[1])+Math.abs(w[2]-DEFAULT_WEIGHT[2]);
    const score = rate - Math.min(dist, 1.0) * 0.05;
    if (score > best_s) { best_s = score; best_w = w; }
  }
  const limited = best_w.map((v, i) => {
    const lo = Math.max(0.15, DEFAULT_WEIGHT[i] - A_MAX_WEIGHT_DEVIATION);
    const hi = Math.min(0.75, DEFAULT_WEIGHT[i] + A_MAX_WEIGHT_DEVIATION);
    return Math.min(Math.max(v, lo), hi);
  });
  const tot = limited.reduce((a, b) => a + b, 0);
  if (tot <= 0) return DEFAULT_WEIGHT;
  return limited.map(x => Math.round((x / tot) * 10000) / 10000);
}

class ModelAState {
  constructor() {
    this.slot_states = {};
    ["凌晨","早上","上午","中午","下午","傍晚","晚上"].forEach(s => {
      this.slot_states[s] = { weight: [...DEFAULT_WEIGHT], last_update_period: 0 };
    });
  }
  force_refresh() { Object.values(this.slot_states).forEach(s => s.last_update_period = 0); }
  get_weight(slot, slot_hist) {
    const state = this.slot_states[slot];
    const n = slot_hist.length;
    if (n >= 50 && (state.last_update_period === 0 || n - state.last_update_period >= WEIGHT_UPDATE_INTERVAL)) {
      state.weight = search_best_weight(slot_hist);
      state.last_update_period = n;
    }
    return state.weight;
  }
}

function _a_reliability(h, w) {
  const r = recent(h, w); const n = r.length;
  if (n <= 1) return 0.0;
  const p = p_big(h, w); const imb = Math.abs(p - 0.5);
  const sf = Math.min(n / Math.max(w, 1), 1.0);
  const sigf = 0.5 + Math.min(imb * 2.0, 0.5);
  return 0.6 * sf + 0.4 * sigf;
}
function _a_reversal(h, w) {
  const r = recent(h, w); if (r.length < A_REVERSAL_STREAK) return 0.0;
  const lb = is_big(r[r.length-1].sum); let streak = 1;
  for (let i = r.length-2; i >= 0; i--) { if (is_big(r[i].sum) === lb) streak++; else break; }
  if (streak < A_REVERSAL_STREAK || streak >= 6) return 0.0;
  const amt = Math.min(0.03, 0.01 * (streak - A_REVERSAL_STREAK + 1));
  return lb ? -amt : amt;
}
function model_a_window(h, w, weight) {
  const r = recent(h, w); if (!r.length) return { score: 0.5, p_big: 0.5, reliability: 0 };
  const p = p_big(h, w);
  const sh = recent(h, Math.min(5, h.length));
  const sp = sh.length ? sh.filter(x => is_big(x.sum)).length / sh.length : 0.5;
  const trend = 0.5 + Math.max(-0.25, Math.min(0.25, (sp - 0.5) * 0.8));
  const lb = is_big(r[r.length-1].sum); let cs = 1;
  for (let i = r.length-2; i >= 0; i--) { if (is_big(r[i].sum) === lb) cs++; else break; }
  const streak_sig = 0.5 + (lb ? 0.25 : -0.25) * Math.min(cs / 5.0, 1.0);
  const [w1, w2, w3] = weight;
  let score = p * w1 + trend * w2 + streak_sig * w3;
  const rev = _a_reversal(h, w); score = Math.max(0, Math.min(1, score + rev));
  const rel = _a_reliability(h, w);
  return { score, p_big: p, reliability: rel };
}

function predict_a(history, current_time) {
  const hour = current_time.getHours(), minute = current_time.getMinutes();
  if (is_maintenance_time(hour, minute)) return { prediction: null, reason: "维护时段" };
  const slot = get_time_slot(hour, minute);
  const slot_hist = history.filter(h => h.hour != null && get_time_slot(h.hour, h.minute) === slot);
  // 用全局单例state（简化：每次predict_a重建，但权重搜索仍按逻辑走）
  const state = new ModelAState();
  const weight = state.get_weight(slot, slot_hist);
  const results = {};
  for (const w of A_WINDOWS) results[w] = model_a_window(history, w, weight);
  let ws = 0, tw = 0; const ww = {};
  for (const w of A_WINDOWS) {
    const rel = results[w].reliability;
    const eff = A_DEFAULT_WINDOW_WEIGHTS[w] * Math.max(rel, A_RELIABILITY_FLOOR);
    ww[w] = eff; ws += eff * results[w].score; tw += eff;
  }
  const final_score = tw > 0 ? ws / tw : results[10].score;
  return { prediction: final_score >= 0.5 ? "大" : "小", weighted_probability: { "大": final_score, "小": 1 - final_score }, type: judge_type(history) };
}

// ============================================================
// 模型B（完整两轮扫描）
// ============================================================
function seed_backtest(h, seed) {
  if (h.length < 50) return { error: 1 };
  const hits = [];
  for (let i = 50; i < h.length; i++) {
    const groups = get_prediction(seed, { nbr: h[i-1].nbr, sum: h[i-1].sum, type: h[i-1].type });
    hits.push(groups.includes(h[i].type) ? 1 : 0);
  }
  const total = hits.length; if (!total) return { error: 1 };
  const overall = hits.reduce((a, b) => a + b, 0) / total;
  const r30 = hits.slice(-30); const rr = r30.reduce((a, b) => a + b, 0) / r30.length;
  const r10 = hits.slice(-10); let ewma = r10[0] || 0.5;
  for (let i = 1; i < r10.length; i++) ewma = B_RECENT_EWMA_ALPHA * r10[i] + (1 - B_RECENT_EWMA_ALPHA) * ewma;
  const blocks = [];
  for (let i = 0; i <= total - 10; i += 10) { const b = hits.slice(i, i + 10); blocks.push(b.reduce((a, c) => a + c, 0) / b.length); }
  let stability = 0.5;
  if (blocks.length >= 2) { const m = blocks.reduce((a, b) => a + b, 0) / blocks.length; const v = blocks.reduce((a, b) => a + (b - m) ** 2, 0) / blocks.length; stability = Math.max(0, Math.min(1, 1 - Math.sqrt(v))); }
  const rb = blocks.slice(-3); let rbs = 0.5;
  if (rb.length >= 2) { const m = rb.reduce((a, b) => a + b, 0) / rb.length; const v = rb.reduce((a, b) => a + (b - m) ** 2, 0) / rb.length; rbs = Math.max(0, Math.min(1, 1 - Math.sqrt(v))); }
  stability = stability * 0.60 + rbs * 0.40;
  let ml = 0, cl = 0; for (const x of hits) { if (!x) { cl++; ml = Math.max(ml, cl); } else cl = 0; }
  const lp = Math.max(0, 1 - ml / total);
  const [wo, wr, ws2, wl] = B_SCORE_WEIGHTS;
  const score = overall * wo + rr * wr + stability * ws2 + lp * wl;
  // group stats
  const gs = {}; ALL_TYPES.forEach(g => gs[g] = { hits: 0, total: 0, excluded: 0, opened: 0 });
  for (let i = 50; i < h.length; i++) {
    const groups = get_prediction(seed, { nbr: h[i-1].nbr, sum: h[i-1].sum, type: h[i-1].type });
    groups.forEach(g => gs[g].total++);
    if (groups.includes(h[i].type)) gs[h[i].type].hits++;
    ALL_TYPES.forEach(g => { if (!groups.includes(g)) gs[g].excluded++; if (h[i].type === g) gs[g].opened++; });
  }
  const gp = {}, ge = {}, gc = {};
  ALL_TYPES.forEach(g => {
    const st = gs[g];
    gp[g] = (st.hits + B_GROUP_SMOOTHING) / (st.total + 2 * B_GROUP_SMOOTHING);
    gc[g] = Math.min(1, st.total / 20);
    const owe = st.opened - st.hits;
    ge[g] = st.excluded ? (owe + B_GROUP_SMOOTHING) / (st.excluded + 2 * B_GROUP_SMOOTHING) : 0.5;
  });
  return { overall, recent_rate: rr, recent_ewma: ewma, stability, score, hits, group_precision: gp, group_confidence: gc, group_excluded_risk: ge };
}

function select_seed(h) {
  if (h.length < 50) return { error: 1 };
  // 粗扫
  const coarse = [];
  for (let s = B_SEED_MIN; s <= B_SEED_MAX; s += B_COARSE_STEP) {
    const d = seed_backtest(h, s); if (d.error) continue;
    coarse.push([d.score, s, d]);
  }
  coarse.sort((a, b) => b[0] - a[0]);
  // 精扫
  const top = coarse.slice(0, Math.min(B_REFINE_TOP, coarse.length));
  const refine_set = new Set();
  for (const [, seed] of top) {
    for (let s = Math.max(B_SEED_MIN, seed - (B_COARSE_STEP - 1)); s <= Math.min(B_SEED_MAX, seed + (B_COARSE_STEP - 1)); s++) refine_set.add(s);
  }
  const refine = [...refine_set].sort((a, b) => a - b);
  const refined = [];
  for (const s of refine) { const d = seed_backtest(h, s); if (d.error) continue; refined.push([d.score, s, d]); }
  // 合并
  const merged = {};
  for (const item of [...coarse, ...refined]) merged[item[1]] = item;
  const ranked = Object.values(merged).sort((a, b) => b[0] - a[0]);
  const pool = ranked.slice(0, Math.min(B_TOP_SEEDS, ranked.length));
  const cand_key = (item) => {
    const [, , d] = item;
    const cons = 1.0 - Math.min(Math.abs(d.overall - d.recent_rate), 1.0);
    const rb = d.recent_block_stability || 0.5;
    const ewma = d.recent_ewma || 0.5;
    return d.score * 0.50 + d.stability * 0.20 + rb * 0.10 + cons * 0.10 + ewma * B_EWMA_SECONDARY_WEIGHT;
  };
  pool.sort((a, b) => cand_key(b) - cand_key(a));
  const final = pool.slice(0, Math.min(B_FINAL_SEEDS, pool.length));
  if (!final.length) return { error: 1 };
  const [bs, best_seed, bd] = final[0];
  return { best_seed, score: bs, detail: bd, candidate_seeds: final.map(x => x[1]) };
}

function predict_b(h) {
  const r = select_seed(h); if (r.error) return { error: 1 };
  const groups = get_prediction(r.best_seed, h[h.length - 1]);
  const gp = r.detail.group_precision || {}; const gc = r.detail.group_confidence || {}; const ge = r.detail.group_excluded_risk || {};
  let odd_s = 0, even_s = 0; const gw = {};
  for (const g of groups) {
    const prec = gp[g] || 0.5, conf = gc[g] || 0, risk = ge[g] || 0.5;
    const qual = 0.5 + 0.5 * prec;
    const pen = B_EXCLUDED_PENALTY_WEIGHT * Math.max(0, risk - 0.5) * conf;
    const w = Math.max(0.05, qual - pen); gw[g] = w;
    if (g.endsWith("单")) odd_s += w; else even_s += w;
  }
  const total = odd_s + even_s; const p_odd = total ? odd_s / total : 0.5;
  return { seed: r.best_seed, p_odd, p_even: 1 - p_odd, prediction: p_odd >= 0.5 ? "单" : "双", groups, group_weights: gw };
}

// ============================================================
// 组合
// ============================================================
function combo_scores(a, b) {
  const a_big = parseFloat(a.weighted_probability["大"] || 0.5);
  const a_small = 1 - a_big;
  const b_odd = parseFloat(b.p_odd || 0.5), b_even = 1 - b_odd;
  return {
    "大单": a_big * COMBO_ALPHA + b_odd * COMBO_BETA,
    "大双": a_big * COMBO_ALPHA + b_even * COMBO_BETA,
    "小单": a_small * COMBO_ALPHA + b_odd * COMBO_BETA,
    "小双": a_small * COMBO_ALPHA + b_even * COMBO_BETA
  };
}
function build_kill(a, b) {
  const sc = combo_scores(a, b);
  const ranked = Object.entries(sc).sort((x, y) => y[1] - x[1] || COMBO_TYPES.indexOf(x[0]) - COMBO_TYPES.indexOf(y[0]));
  const killed = ranked[ranked.length - 1][0];
  return { scores: sc, killed_group: killed, recommended: ranked.filter(([g]) => g !== killed).map(([g]) => g) };
}

// ============================================================
// 数据解析（适配pc28.help返回格式）
// ============================================================
function parse_api(raw) {
  if (!raw || raw.message !== "success" || !Array.isArray(raw.data)) throw new Error("接口格式异常");
  const out = [];
  for (const it of raw.data) {
    const nbr = String(it.nbr).trim(); if (!nbr) continue;
    let nums, sum;
    if (typeof it.num !== "undefined" && it.num !== null && it.num !== "") {
      sum = parseInt(it.num);
      nums = [Math.floor(sum/100)%10, Math.floor(sum/10)%10, sum%10];
    } else if (typeof it.number === "string" && it.number.includes("+")) {
      const parts = it.number.split("+").map(x => parseInt(x.trim()));
      if (parts.length === 3 && !parts.some(isNaN)) { nums = parts; sum = parts.reduce((a,b)=>a+b,0); }
      else { sum = parseInt(it.number); nums = [Math.floor(sum/100)%10, Math.floor(sum/10)%10, sum%10]; }
    } else {
      sum = parseInt(it.number || it.num || it.sum);
      if (isNaN(sum)) continue;
      nums = [Math.floor(sum/100)%10, Math.floor(sum/10)%10, sum%10];
    }
    let hour = null, minute = null;
    if (it.time) { const parts = String(it.time).substring(0,8).split(":"); if (parts.length >= 2) { hour = parseInt(parts[0]); minute = parseInt(parts[1]); } }
    const type = get_type(sum);
    out.push({ nbr, date: it.date, time: it.time, number: `${nums[0]}+${nums[1]}+${nums[2]}`, num: sum, sum, type, hour, minute });
  }
  out.sort((a, b) => parseInt(a.nbr) - parseInt(b.nbr));
  return out.slice(-100);
}

// ============================================================
// 会话状态 & 验证
// ============================================================
let historyData = [];
let session = { total: 0, hitA: 0, hitB: 0, hitF: 0, records: [] };

function log_msg(m) {
  const l = document.getElementById("log");
  const p = document.createElement("p");
  p.textContent = `[${new Date().toLocaleTimeString()}] ${m}`;
  l.appendChild(p); l.scrollTop = l.scrollHeight;
}

function verify() {
  if (!historyData.length) return;
  const map = {}; historyData.forEach(h => map[parseInt(h.nbr)] = h);
  session.records.forEach(rec => {
    if (rec.status === "已验证") return;
    const act = map[rec.target];
    if (!act) return;
    const aHit = rec.predA === null ? null : (rec.predA === get_size(act.sum) ? "命中" : "错误");
    const bHit = rec.predB === null ? null : (rec.predB === get_parity(act.sum) ? "命中" : "错误");
    let fHit = "错误";
    if (rec.killed && ALL_TYPES.includes(rec.killed)) fHit = act.type !== rec.killed ? "命中" : "错误";
    else if (rec.predA && rec.predB) fHit = (act.type[0] === rec.predA || act.type[1] === rec.predB) ? "命中" : "错误";
    rec.status = "已验证"; rec.actual = act; rec.aRes = aHit; rec.bRes = bHit; rec.fRes = fHit;
    session.total++;
    if (aHit === "命中") session.hitA++;
    if (bHit === "命中") session.hitB++;
    if (fHit === "命中") session.hitF++;
  });
  session.records = session.records.slice(-100);
}

function update_ui() {
  if (!historyData.length) return;
  const latest = historyData[historyData.length - 1];
  const target = String(parseInt(latest.nbr) + 1);
  document.getElementById("target-period").textContent = target;
  document.getElementById("prev-period").textContent = latest.nbr;
  document.getElementById("prev-open").textContent = `${latest.number}=${latest.sum}(${latest.type})`;

  const dt = new Date();
  const resA = predict_a(historyData, dt);
  document.getElementById("model-a").textContent = resA.prediction || "--";

  let resB = { p_odd: 0.5, prediction: "--" };
  if (historyData.length >= 50) {
    try { resB = predict_b(historyData); document.getElementById("model-b").textContent = resB.prediction; }
    catch(e) { document.getElementById("model-b").textContent = "错误"; log_msg("B模型错误: " + e.message); }
  } else document.getElementById("model-b").textContent = "数据不足";

  if (resA.prediction && resB.prediction !== "--") {
    const kill = build_kill(resA, resB);
    document.getElementById("combo-scores").textContent = Object.entries(kill.scores).map(([k,v]) => `${k}:${v.toFixed(3)}`).join(" | ");
    document.getElementById("kill-group").textContent = `杀${kill.killed_group}`;
    document.getElementById("buy-groups").textContent = kill.recommended.join(" ");
    if (!session.records.find(r => r.target === parseInt(target))) {
      session.records.push({ target: parseInt(target), predA: resA.prediction, predB: resB.prediction, killed: kill.killed_group, status: "待验证" });
    }
  }

  document.getElementById("stat-total").textContent = session.total;
  const pct = x => session.total ? ((x / session.total) * 100).toFixed(1) + "%" : "0%";
  document.getElementById("stat-a").textContent = `${session.hitA}/${session.total} (${pct(session.hitA)})`;
  document.getElementById("stat-b").textContent = `${session.hitB}/${session.total} (${pct(session.hitB)})`;
  document.getElementById("stat-final").textContent = `${session.hitF}/${session.total} (${pct(session.hitF)})`;

  const tb = document.getElementById("history-body"); tb.innerHTML = "";
  historyData.slice(-30).reverse().forEach(h => {
    const cls = `tag-${h.type === "大单" ? "big-odd" : h.type === "大双" ? "big-even" : h.type === "小单" ? "small-odd" : "small-even"}`;
    const rec = session.records.find(r => r.target === parseInt(h.nbr));
    let predText = "--";
    if (rec && rec.killed) predText = "杀" + rec.killed;
    else if (historyData.length >= 2) {
      const idx = historyData.findIndex(x => x.nbr === h.nbr);
      if (idx > 0) {
        const prevSlice = historyData.slice(0, idx);
        try {
          const pa = predict_a(prevSlice, new Date());
          const pb = predict_b(prevSlice);
          if (pa.prediction && pb.prediction !== "--") { const k = build_kill(pa, pb); predText = "杀" + k.killed_group; }
        } catch(e) {}
      }
    }
    let resTxt = '<span class="pending">待开</span>';
    if (rec && rec.status === "已验证") resTxt = rec.fRes === "命中" ? '<span class="hit">✓</span>' : '<span class="miss">✗</span>';
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${h.nbr}</td><td>${h.number}</td><td><span class="tag ${cls}">${h.type}</span></td><td><span class="tag tag-pred">${predText}</span></td><td>${resTxt}</td>`;
    tb.appendChild(tr);
  });
}

// ============================================================
// 主轮询
// ============================================================
async function pull() {
  try {
    const resp = await fetch(API_URL, { mode: "cors", headers: { "Accept": "application/json" } });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const json = await resp.json();
    const parsed = parse_api(json);
    if (!parsed.length) throw new Error("解析后无数据");
    historyData = parsed;
    log_msg(`✅ 实拉 ${historyData.length} 期，最新期 ${historyData[historyData.length-1].nbr}`);
    verify();
    update_ui();
  } catch(err) {
    log_msg("❌ 请求失败：" + err.message);
  }
}

log_msg("🚀 启动，接口 pc28.help/api/kj.json?nbr=100，轮询15s");
pull();
setInterval(pull, CHECK_INTERVAL);
</script>
