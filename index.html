<style>

<body>

<div class="panel">

<div class="panel">

    <thead><tr><th>期号</th><th>开奖结果</th><th>类型</th><th>预测答案</th><th>结果</th></tr></thead>
    <tbody id="history-body"></tbody>
  </table>

<div id="log"><p>⏳ 启动中...</p></div>

<script>
// ============================================================
// 常量
// ============================================================
const API_URL = "https://pc28.help/api/kj.json?nbr=100";
const CHECK_INTERVAL = 30000;
const STORAGE_KEY = "pc28_v122_session";
const CACHE_KEY = "pc28_v122_cache";

const COMBO_ALPHA = 0.50, COMBO_BETA = 0.50;
const A_WINDOWS = [10, 20, 30, 50, 100];
const A_DEFAULT_WINDOW_WEIGHTS = {10:0.10, 20:0.15, 30:0.20, 50:0.25, 100:0.30};
const A_RELIABILITY_FLOOR = 0.30;
const A_REVERSAL_STREAK = 4;
const A_TYPE_WINDOWS = [10, 20, 30];
const A_MAX_WEIGHT_DEVIATION = 0.10;
const B_SEED_MIN = 1000, B_SEED_MAX = 50000, B_COARSE_STEP = 10;
const B_REFINE_TOP = 100, B_TOP_SEEDS = 50, B_FINAL_SEEDS = 7;
const B_SCORE_WEIGHTS = [0.40, 0.30, 0.20, 0.10];
const B_GROUP_SMOOTHING = 0.5, B_EXCLUDED_PENALTY_WEIGHT = 0.10;
const B_RECENT_EWMA_ALPHA = 0.35, B_EWMA_SECONDARY_WEIGHT = 0.10;
const ALL_TYPES = ["大单","大双","小单","小双"];
const COMBO_TYPES = ["大单","大双","小单","小双"];
const DEFAULT_WEIGHT = [0.4, 0.3, 0.3];
const WEIGHT_UPDATE_INTERVAL = 20;

// ============================================================
// localStorage 持久化
// ============================================================
function save_session() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(session)); } catch(e) {}
}
function load_session() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    // 恢复 Map 等不可序列化对象为普通对象
    return { total: parsed.total||0, hitA: parsed.hitA||0, hitB: parsed.hitB||0, hitF: parsed.hitF||0, records: parsed.records||[] };
  } catch(e) { return null; }
}
function save_cache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ historyData, lastNbr, savedAt: Date.now() }));
  } catch(e) {}
}
function load_cache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

// ============================================================
// 工具函数
// ============================================================
function get_type(sum_val) { return (sum_val >= 14 ? "大" : "小") + (sum_val % 2 === 1 ? "单" : "双"); }
function is_big(s) { return s >= 14; }
function get_size(s) { return is_big(s) ? "大" : "小"; }
function get_parity(s) { return s % 2 === 1 ? "单" : "双"; }
function get_time_slot(hour, minute) {
  if (hour === 19 && minute < 30) return "维护时段";
  if (hour < 6) return "凌晨"; if (hour < 8) return "早上"; if (hour < 12) return "上午";
  if (hour < 14) return "中午"; if (hour < 18) return "下午"; if (hour < 19) return "傍晚";
  return "晚上";
}
function is_maintenance_time(h, m) { return h === 19 && m < 30; }
function mulberry32(seed) {
  function imul32(a,b){let v=((a&0xFFFFFFFF)*(b&0xFFFFFFFF))&0xFFFFFFFF;if(v&0x80000000)v-=0x100000000;return v;}
  let a=(parseInt(seed)&0xFFFFFFFF)+0x6D2B79F5;a&=0xFFFFFFFF;
  let t=imul32((a^(a>>>15)),(1|a));t=(t+imul32((t^(t>>>7)),(61|t)))^t;t&=0xFFFFFFFF;t^=(t>>>14);
  return ((t&0xFFFFFFFF)/4294967296.0);
}
const SEQUENCES=[[0,3,9,12,15,18,21,24,27],[1,4,7,10,13,16,19,22,25],[2,5,8,11,14,17,20,23,26]];
function is_same_seq(a,b){return SEQUENCES.some(s=>s.includes(a)&&s.includes(b));}
const RULES={same:{"小双":["小双","大双","大单"],"小单":["小单","大单","大双"],"大双":["大双","小双","小单"],"大单":["大单","小单","小双"]},diff:{"小双":["小双","小单","大单"],"小单":["小单","小双","大双"],"大双":["大双","大单","小单"],"大单":["大单","大双","小双"]}};
function get_prediction(seed, prev) {
  const rv=mulberry32(seed+parseInt(prev.nbr||prev.expect));
  const prod=rv*prev.sum;
  const digits=prod.toFixed(3).replace(".","");
  const fs=[...digits].reduce((a,d)=>a+parseInt(d),0);
  const ct=get_type(fs);
  const rs=[...rv.toFixed(8).split(".")[1].slice(0,3)].reduce((a,d)=>a+parseInt(d),0);
  return[...RULES[is_same_seq(rs,prev.sum)?"same":"diff"][ct]];
}

// ============================================================
// 模型A
// ============================================================
function recent(h,w){return h.length>=w?h.slice(-w):h;}
function p_big(h,w){const r=recent(h,w);return r.length?r.filter(x=>is_big(x.sum)).length/r.length:0.5;}
function max_streak(h,w){const r=recent(h,w);if(!r.length)return 0;let m=1,c=1;for(let i=1;i<r.length;i++){if(is_big(r[i].sum)===is_big(r[i-1].sum)){c++;m=Math.max(m,c);}else c=1;}return m;}
function alternation(h,w){const r=recent(h,w);let a=0;for(let i=1;i<r.length;i++)if(is_big(r[i].sum)!==is_big(r[i-1].sum))a++;return a;}
function judge_type(h){
  if(h.length<10)return"均衡型";
  const types=A_TYPE_WINDOWS.filter(w=>h.length>=w).map(w=>{
    const p=p_big(h,w),s=max_streak(h,w),a=alternation(h,w);
    if(s<=2&&a>=Math.max(6,Math.floor(w*0.6)))return"交替型";
    if((p>=0.6||p<=0.4)&&s>=4)return"趋势型";
    if((p>=0.55||p<=0.45)&&s<=2&&a<=Math.max(5,Math.floor(w*0.5)))return"信号型";
    return"均衡型";
  });
  const cnt={};types.forEach(t=>cnt[t]=(cnt[t]||0)+1);
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  if(best[0]!=="均衡型"&&best[1]<2)return"均衡型";return best[0];
}
function search_best_weight(hist){
  if(hist.length<50)return DEFAULT_WEIGHT;
  const cands=[];for(let i=0;i<13;i++)cands.push(Math.round((0.15+i*0.05)*100)/100);
  const cw=[];
  for(const w1 of cands)for(const w2 of cands){const w3=Math.round((1-w1-w2)*100)/100;if(w3>=0.15&&w3<=0.75&&Math.abs(w1+w2+w3-1)<=0.001)cw.push([w1,w2,w3]);}
  let best_s=-1,best_w=DEFAULT_WEIGHT;
  for(const w of cw){let hits=0,total=0;for(let i=10;i<Math.min(hist.length,80);i++){const p=p_big(hist.slice(0,i),10);const raw=p*w[0]+0.5*w[1]+0.5*w[2];if((raw>=0.5)==is_big(hist[i].sum))hits++;total++;}const rate=total?hits/total:0.5;const dist=Math.abs(w[0]-0.4)+Math.abs(w[1]-0.3)+Math.abs(w[2]-0.3);if(rate-Math.min(dist,1)*0.05>best_s){best_s=rate-Math.min(dist,1)*0.05;best_w=w;}}
  return best_w;
}
function predict_a(history,dt){
  const h=dt.getHours(),m=dt.getMinutes();
  if(is_maintenance_time(h,m))return{prediction:null,reason:"维护时段"};
  const slot=history.filter(x=>x.hour!=null&&get_time_slot(x.hour,x.minute)===get_time_slot(h,m));
  const w=search_best_weight(slot.length>=10?slot:history);
  const res={};for(const win of A_WINDOWS){const r=recent(history,win);if(!r.length){res[win]={score:0.5,p_big:0.5,rel:0};continue;}const p=p_big(history,win);const lb=is_big(r[r.length-1].sum);let cs=1;for(let i=r.length-2;i>=0;i--){if(is_big(r[i].sum)===lb)cs++;else break;}const streak_sig=0.5+(lb?0.25:-0.25)*Math.min(cs/5,1);let score=p*w[0]+0.5*w[1]+streak_sig*w[2];if(cs>=4&&cs<6){const adj=Math.min(0.03,0.01*(cs-3));score+=lb?-adj:adj;}res[win]={score:Math.max(0,Math.min(1,score)),p_big:p,rel:Math.min(r.length/win,1)*0.6+Math.min(Math.abs(p-0.5)*2,0.5)*0.4};}
  let ws=0,tw=0;for(const win of A_WINDOWS){const eff=A_DEFAULT_WINDOW_WEIGHTS[win]*Math.max(res[win].rel,A_RELIABILITY_FLOOR);ws+=eff*res[win].score;tw+=eff;}
  const fs=tw>0?ws/tw:0.5;
  return{prediction:fs>=0.5?"大":"小",weighted_probability:{"大":fs,"小":1-fs},type:judge_type(history)};
}

// ============================================================
// 模型B
// ============================================================
function seed_backtest(h,seed){
  if(h.length<50)return{error:1};
  const hits=[];
  for(let i=50;i<h.length;i++){const g=get_prediction(seed,{nbr:h[i-1].nbr,sum:h[i-1].sum,type:h[i-1].type});hits.push(g.includes(h[i].type)?1:0);}
  const total=hits.length;if(!total)return{error:1};
  const overall=hits.reduce((a,b)=>a+b,0)/total;
  const r30=hits.slice(-30);const rr=r30.reduce((a,b)=>a+b,0)/r30.length;
  const blocks=[];for(let i=0;i<=total-10;i+=10){const b=hits.slice(i,i+10);blocks.push(b.reduce((a,c)=>a+c,0)/b.length);}
  let stability=0.5;if(blocks.length>=2){const m=blocks.reduce((a,b)=>a+b,0)/blocks.length;const v=blocks.reduce((a,b)=>a+(b-m)**2,0)/blocks.length;stability=Math.max(0,Math.min(1,1-Math.sqrt(v)));}
  let ml=0,cl=0;for(const x of hits){if(!x){cl++;ml=Math.max(ml,cl);}else cl=0;}
  const lp=Math.max(0,1-ml/total);
  return{overall,recent_rate:rr,stability,score:overall*0.4+rr*0.3+stability*0.2+lp*0.1,hits};
}
function select_seed(h){
  if(h.length<50)return{error:1};
  let bs=-1,bseed=null,bd=null;
  for(let s=B_SEED_MIN;s<=B_SEED_MAX;s+=B_COARSE_STEP){const d=seed_backtest(h,s);if(d.error)continue;if(d.score>bs){bs=d.score;bseed=s;bd=d;}}
  if(!bseed)return{error:1};
  const ss=Math.max(B_SEED_MIN,bseed-9),es=Math.min(B_SEED_MAX,bseed+9);
  for(let s=ss;s<=es;s++){const d=seed_backtest(h,s);if(d.error)continue;if(d.score>bs){bs=d.score;bseed=s;bd=d;}}
  return{best_seed:bseed,score:bs,detail:bd};
}
function predict_b(h){
  const r=select_seed(h);if(r.error)return{error:1};
  const g=get_prediction(r.best_seed,h[h.length-1]);
  let o=0,e=0;g.forEach(x=>x.endsWith("单")?o++:e++);
  const t=o+e;return{seed:r.best_seed,p_odd:t?o/t:0.5,p_even:t?e/t:0.5,prediction:(t?o/t:0.5)>=0.5?"单":"双",groups:g};
}

// ============================================================
// 组合
// ============================================================
function combo_scores(a,b){
  const aBig=a.weighted_probability["大"]||0.5,aSmall=1-aBig;
  const bOdd=b.p_odd||0.5,bEven=1-bOdd;
  return{"大单":aBig*COMBO_ALPHA+bOdd*COMBO_BETA,"大双":aBig*COMBO_ALPHA+bEven*COMBO_BETA,"小单":aSmall*COMBO_ALPHA+bOdd*COMBO_BETA,"小双":aSmall*COMBO_ALPHA+bEven*COMBO_BETA};
}
function build_kill(a,b){
  const sc=combo_scores(a,b);
  const ranked=Object.entries(sc).sort((x,y)=>y[1]-x[1]);
  const killed=ranked[ranked.length-1][0];
  return{scores:sc,killed_group:killed,recommended:ranked.slice(0,-1).map(x=>x[0])};
}

// ============================================================
// 数据解析
// ============================================================
function parse_api(raw){
  if(!raw||raw.message!=="success"||!Array.isArray(raw.data))throw new Error("接口格式异常");
  const out=[];
  for(const it of raw.data){
    const nbr=String(it.nbr).trim();if(!nbr)continue;
    let nums,sum;
    if(typeof it.num!=="undefined"&&it.num!==null&&it.num!==""){sum=parseInt(it.num);nums=[Math.floor(sum/100)%10,Math.floor(sum/10)%10,sum%10];}
    else if(typeof it.number==="string"&&it.number.includes("+")){const p=it.number.split("+").map(x=>parseInt(x.trim()));if(p.length===3&&!p.some(isNaN)){nums=p;sum=p.reduce((a,b)=>a+b,0);}else{sum=parseInt(it.number);nums=[Math.floor(sum/100)%10,Math.floor(sum/10)%10,sum%10];}}
    else{sum=parseInt(it.number||it.num||it.sum);if(isNaN(sum))continue;nums=[Math.floor(sum/100)%10,Math.floor(sum/10)%10,sum%10];}
    let hour=null,minute=null;
    if(it.time){const p=String(it.time).substring(0,8).split(":");if(p.length>=2){hour=parseInt(p[0]);minute=parseInt(p[1]);}}
    out.push({nbr,date:it.date,time:it.time,number:`${nums[0]}+${nums[1]}+${nums[2]}`,num:sum,sum,type:get_type(sum),hour,minute});
  }
  out.sort((a,b)=>parseInt(a.nbr)-parseInt(b.nbr));
  return out.slice(-100);
}

// ============================================================
// 状态 & 验证
// ============================================================
let historyData = [];
let session = load_session() || { total: 0, hitA: 0, hitB: 0, hitF: 0, records: [] };
let lastNbr = null;
let bComputing = false; // 防重复计算

function log_msg(m){
  const l=document.getElementById("log"),p=document.createElement("p");
  p.textContent=`[${new Date().toLocaleTimeString()}] ${m}`;
  l.appendChild(p);l.scrollTop=l.scrollHeight;
}

function set_b(text, cls="tag-loading"){
  document.getElementById("model-b").innerHTML=`<span class="tag ${cls}">${text}</span>`;
}

function verify(){
  if(!historyData.length)return;
  const map={};historyData.forEach(h=>map[parseInt(h.nbr)]=h);
  session.records.forEach(rec=>{
    if(rec.status==="已验证")return;
    const act=map[rec.target];if(!act)return;
    const aHit=rec.predA===null?null:(rec.predA===get_size(act.sum)?"命中":"错误");
    const bHit=rec.predB===null?null:(rec.predB===get_parity(act.sum)?"命中":"错误");
    let fHit="错误";
    if(rec.killed&&ALL_TYPES.includes(rec.killed))fHit=act.type!==rec.killed?"命中":"错误";
    else if(rec.predA&&rec.predB)fHit=(act.type[0]===rec.predA||act.type[1]===rec.predB)?"命中":"错误";
    rec.status="已验证";rec.actual=act;rec.aRes=aHit;rec.bRes=bHit;rec.fRes=fHit;
    session.total++;if(aHit==="命中")session.hitA++;if(bHit==="命中")session.hitB++;if(fHit==="命中")session.hitF++;
  });
  session.records=session.records.slice(-100);
  save_session(); // 每次验证完立即持久化
}

function render_ui(showCacheBadge){
  if(!historyData.length)return;
  const latest=historyData[historyData.length-1];
  if(lastNbr!==null&&lastNbr===latest.nbr)return; // 期号没变不重渲染
  lastNbr=latest.nbr;

  const target=String(parseInt(latest.nbr)+1);
  document.getElementById("target-period").textContent=target;
  document.getElementById("prev-period").textContent=latest.nbr;
  document.getElementById("prev-open").textContent=`${latest.number}=${latest.sum}(${latest.type})`;

  // 缓存标记
  document.getElementById("cache-badge").innerHTML=showCacheBadge?'<span class="tag tag-cached">缓存</span>':'';

  const dt=new Date();
  const resA=predict_a(historyData,dt);
  document.getElementById("model-a").textContent=resA.prediction||"--";

  // B模型异步，避免阻塞渲染
  if(!bComputing){
    set_b("计算中...","tag-loading");
    bComputing=true;
    setTimeout(()=>{
      try{
        let resB={p_odd:0.5,prediction:"--"};
        if(historyData.length>=50){resB=predict_b(historyData);set_b(resB.prediction,"tag-loading");}
        else set_b("数据不足","");
        if(resA.prediction&&resB.prediction!=="--"){
          const kill=build_kill(resA,resB);
          document.getElementById("combo-scores").textContent=Object.entries(kill.scores).map(([k,v])=>`${k}:${v.toFixed(3)}`).join(" | ");
          document.getElementById("kill-group").textContent=`杀${kill.killed_group}`;
          document.getElementById("buy-groups").textContent=kill.recommended.join(" ");
          if(!session.records.find(r=>r.target===parseInt(target))){
            session.records.push({target:parseInt(target),predA:resA.prediction,predB:resB.prediction,killed:kill.killed_group,status:"待验证"});
          }
        }
      }catch(e){set_b("错误","");log_msg("B模型错误: "+e.message);}
      bComputing=false;
      save_session();
    },50);
  }

  document.getElementById("stat-total").textContent=session.total;
  const pct=x=>session.total?((x/session.total)*100).toFixed(1)+"%":"0%";
  document.getElementById("stat-a").textContent=`${session.hitA}/${session.total} (${pct(session.hitA)})`;
  document.getElementById("stat-b").textContent=`${session.hitB}/${session.total} (${pct(session.hitB)})`;
  document.getElementById("stat-final").textContent=`${session.hitF}/${session.total} (${pct(session.hitF)})`;

  const tb=document.getElementById("history-body");tb.innerHTML="";
  historyData.slice(-30).reverse().forEach(h=>{
    const cls=`tag-${h.type==="大单"?"big-odd":h.type==="大双"?"big-even":h.type==="小单"?"small-odd":"small-even"}`;
    const rec=session.records.find(r=>r.target===parseInt(h.nbr));
    let predText="--";
    if(rec&&rec.killed)predText="杀"+rec.killed;
    else if(historyData.length>=2){
      const idx=historyData.findIndex(x=>x.nbr===h.nbr);
      if(idx>0){try{const pa=predict_a(historyData.slice(0,idx),new Date()),pb=predict_b(historyData.slice(0,idx));if(pa.prediction&&pb.prediction!=="--")predText="杀"+build_kill(pa,pb).killed_group;}catch(e){}}
    }
    let resTxt='<span class="pending">待开</span>';
    if(rec&&rec.status==="已验证")resTxt=rec.fRes==="命中"?'<span class="hit">✓</span>':'<span class="miss">✗</span>';
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${h.nbr}</td><td>${h.number}</td><td><span class="tag ${cls}">${h.type}</span></td><td><span class="tag tag-pred">${predText}</span></td><td>${resTxt}</td>`;
    tb.appendChild(tr);
  });
}

// ============================================================
// 主逻辑
// ============================================================
async function pull(isBackground){
  try{
    if(!isBackground)set_b("拉取中...","tag-loading");
    const resp=await fetch(API_URL,{mode:"cors",headers:{"Accept":"application/json"}});
    if(!resp.ok)throw new Error("HTTP "+resp.status);
    const json=await resp.json();
    const parsed=parse_api(json);
    if(!parsed.length)throw new Error("解析后无数据");

    const oldNbr=historyData.length?historyData[historyData.length-1].nbr:null;
    historyData=parsed;
    save_cache(); // 持久化缓存

    const newNbr=historyData[historyData.length-1].nbr;
    if(oldNbr!==newNbr)log_msg(`✅ 更新 ${parsed.length} 期，最新期 ${newNbr}`);

    verify();
    render_ui(false);
  }catch(err){
    log_msg("❌ 请求失败："+err.message);
    if(!isBackground)set_b("获取失败","");
  }
}

// ============================================================
// 页面可见性恢复 → 立即补拉
// ============================================================
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    log_msg("👁 页面恢复，立即补拉数据");
    pull(true);
  }
});

// ============================================================
// 启动：先恢复缓存 → 再拉新数据
// ============================================================
(function init(){
  const cached=load_cache();
  if(cached&&cached.historyData&&cached.historyData.length){
    historyData=cached.historyData;
    lastNbr=cached.lastNbr;
    log_msg(`📦 恢复缓存数据 ${historyData.length} 期（上次保存于 ${new Date(cached.savedAt).toLocaleTimeString()}）`);
    verify();
    render_ui(true); // 显示"缓存"标记
  }
  log_msg("🚀 启动，轮询30s");
  pull(false);
  setInterval(()=>pull(false),CHECK_INTERVAL);
})();
</script>
